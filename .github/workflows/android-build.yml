name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.8.2"
  BUILD_TOOLS: "37.0.0"
  PLATFORM: "android-37.0"  # sdkmanager names API 37 "android-37.0"

jobs:
  build:
    name: Signed release (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships an Android SDK; use its sdkmanager directly.
      - name: Install SDK Platform 37 + Build Tools 37.0.0
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;${PLATFORM}" "build-tools;${BUILD_TOOLS}" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
          ls "$SDK/platforms" "$SDK/build-tools"

      # Fixed Gradle version, so a committed wrapper is not required.
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Check signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret: $v"; missing=1; fi
          done
          exit $missing

      # Integration keys reach BuildConfig / google-services through env vars
      # (app/build.gradle.kts -> secret()). Without them a build looks healthy but ships broken:
      # no ADJUST_APP_TOKEN = no attribution, no OFFER_BASE_URL = White forever, no
      # GOOGLE_SERVICES_JSON = no push. Fail here instead of discovering it weeks later.
      - name: Check integration secrets are present
        env:
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          fail=0
          for v in ADJUST_APP_TOKEN OFFER_BASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret: $v"; fail=1; fi
          done
          case "$OFFER_BASE_URL" in
            http://*|https://*|"") ;;
            *) echo "::error::OFFER_BASE_URL must start with http:// or https://"; fail=1 ;;
          esac
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set - the build would ship without push."
            fail=1
          elif ! printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d 2>/dev/null | grep -q '"project_number"'; then
            echo "::error::GOOGLE_SERVICES_JSON does not decode: it must be base64 of google-services.json."
            fail=1
          fi
          exit $fail

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="${RUNNER_TEMP}/release-keystore.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          test -s "$KS" || { echo "::error::Decoded keystore is empty"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Unit tests
        env:
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          OFFER_ROUTING: ${{ secrets.OFFER_ROUTING }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADJUST_APP_TOKEN: ${{ secrets.ADJUST_APP_TOKEN }}
          OFFER_BASE_URL: ${{ secrets.OFFER_BASE_URL }}
          OFFER_ROUTING: ${{ secrets.OFFER_ROUTING }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature (fail on debug cert)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Release APK not found (unsigned build?)"; exit 1; }
          if ! apksigner verify --verbose --print-certs "$APK" > apksigner.txt 2>&1; then
            cat apksigner.txt
            echo "::error::apksigner verification failed"
            exit 1
          fi
          grep -E "Verified using|Signer #1 certificate DN" apksigner.txt || true
          if grep -q "CN=Android Debug" apksigner.txt; then
            echo "::error::APK is signed with the Android DEBUG certificate"
            exit 1
          fi

      - name: Verify AAB signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::Release AAB not found"; exit 1; }
          jarsigner -verify -certs "$AAB" > jarsigner.txt 2>&1 || { cat jarsigner.txt; echo "::error::AAB verification failed"; exit 1; }
          grep -q "jar verified" jarsigner.txt || { cat jarsigner.txt; echo "::error::AAB not verified"; exit 1; }
          if grep -q "CN=Android Debug" jarsigner.txt; then
            echo "::error::AAB is signed with the Android DEBUG certificate"
            exit 1
          fi

      - name: Check 16 KB page-size alignment
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if unzip -l "$APK" | grep -q '\.so$'; then
            zipalign -c -P 16 -v 4 "$APK"
          else
            echo "No native libraries in the APK — 16 KB page-size compatible."
          fi

      - name: Upload APK (test artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chickie-runway-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chickie-runway-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-keystore.p12"
